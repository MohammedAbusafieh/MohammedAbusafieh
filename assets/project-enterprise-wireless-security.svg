 </defs><rect width="1200" height="455" rx="18" fill="url(#projectcv5-bg)"/><rect width="1200" height="455" rx="18" fill="url(#projectcv5-glow)"/><rect width="1200" height="455" rx="18" fill="url(#projectcv5-grid)"/><text x="48" y="48" fill="#C77B9B" font-family="monospace" font-size="12" letter-spacing="3">05 / PROJECT PROFILE</text><text x="48" y="102" fill="#F8F0F3" font-family="Georgia,serif" font-size="27">Enterprise Wireless Network Security</text><text x="48" y="138" fill="#E5B5C7" font-family="Arial" font-size="16">Lead Network Designer · Cisco Packet Tracer</text><text x="48" y="185" fill="#D8C8CE" font-family="Arial" font-size="13.5">Engineered a multi-floor enterprise wireless topology and validated security</text><text x="48" y="209" fill="#D8C8CE" font-family="Arial" font-size="13.5">across simulated floors. Configured access points, switches, WPA2-AES, centralized</text><text x="48" y="233" fill="#D8C8CE" font-family="Arial" font-size="13.5">RADIUS/AAA, WLC, DHCP, IoT devices and RFID authentication systems.</text><path d="M48 260H690" stroke="#451126"/><rect x="48" y="323" width="166.7" height="28" rx="14" fill="#451126" stroke="#8B3B5D"/><text x="131.35" y="341.5" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="10.5">CISCO PACKET TRACER</text><rect x="210" y="323" width="100" height="28" rx="14" fill="#451126" stroke="#8B3B5D"/><text x="260" y="341.5" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="10.5">WLC</text><rect x="372" y="323" width="115.6" height="28" rx="14" fill="#451126" stroke="#8B3B5D"/><text x="429.8" y="341.5" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="10.5">RADIUS / AAA</text><rect x="48" y="359" width="100" height="28" rx="14" fill="#451126" stroke="#8B3B5D"/><text x="98" y="377.5" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="10.5">WPA2-AES</text><rect x="210" y="359" width="100" height="28" rx="14" fill="#451126" stroke="#8B3B5D"/><text x="260" y="377.5" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="10.5">DHCP</text><rect x="372" y="359" width="101" height="28" rx="14" fill="#451126" stroke="#8B3B5D"/><text x="422.5" y="377.5" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="10.5">IOT / RFID</text><rect x="732" y="84" width="420" height="235" rx="14" fill="#10070C" stroke="#6F2946"/><text x="758" y="108" fill="#C77B9B" font-family="monospace" font-size="10.5" letter-spacing="2">ASSESSMENT WORKFLOW</text><rect x="758" y="115" width="152" height="60" rx="9" fill="#190B12" stroke="#8B3B5D"/><text x="834" y="139" text-anchor="middle" fill="#F8F0F3" font-family="Arial" font-size="12.5">WIRELESS CLIENTS</text><text x="834" y="159" text-anchor="middle" fill="#C77B9B" font-family="monospace" font-size="9.5">MULTI-FLOOR</text><rect x="944" y="115" width="152" height="60" rx="9" fill="#190B12" stroke="#8B3B5D"/><text x="1020" y="139" text-anchor="middle" fill="#F8F0F3" font-family="Arial" font-size="12.5">ACCESS POINTS</text><text x="1020" y="159" text-anchor="middle" fill="#C77B9B" font-family="monospace" font-size="9.5">SWITCHING</text><rect x="758" y="198" width="152" height="60" rx="9" fill="#190B12" stroke="#8B3B5D"/><text x="834" y="222" text-anchor="middle" fill="#F8F0F3" font-family="Arial" font-size="12.5">AUTHENTICATION</text><text x="834" y="242" text-anchor="middle" fill="#C77B9B" font-family="monospace" font-size="9.5">RADIUS / AAA</text><rect x="944" y="198" width="152" height="60" rx="9" fill="#190B12" stroke="#8B3B5D"/><text x="1020" y="222" text-anchor="middle" fill="#F8F0F3" font-family="Arial" font-size="12.5">SERVICES</text><text x="1020" y="242" text-anchor="middle" fill="#C77B9B" font-family="monospace" font-size="9.5">WLC / DHCP / RFID</text><path d="M910 145H944M834 175V198M1020 175V198M910 228H944" stroke="#C77B9B" stroke-width="2" fill="none"/>
 <rect x="48" y="394" width="1104" height="42" rx="8" fill="#451126" stroke="#8B3B5D"/><text x="70" y="421" fill="#F8F0F3" font-family="Arial" font-size="14">Role: Lead Network Designer · secure wireless communications across multiple simulated floors.</text><circle cx="1117" cy="415" r="5" fill="#F8F0F3"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></circle>
