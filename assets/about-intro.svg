 <text x="58" y="157" fill="#D8C8CE" font-family="Arial" font-size="15.5">Hands-on experience in IT support, networking, penetration testing,</text><text x="58" y="183" fill="#D8C8CE" font-family="Arial" font-size="15.5">vulnerability assessment, network security and malware analysis.</text><text x="58" y="223" fill="#D8C8CE" font-family="Arial" font-size="15.5">Built MalwareX and NetGuard Pro, alongside penetration-testing and web</text><text x="58" y="249" fill="#D8C8CE" font-family="Arial" font-size="15.5">security labs. Proficient in Kali Linux, Nmap, Metasploit, Burp Suite,</text><text x="58" y="275" fill="#D8C8CE" font-family="Arial" font-size="15.5">Wireshark, Python, Splunk and Cisco networking technologies.</text>
