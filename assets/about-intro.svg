<rect x="25" y="24" width="1150" height="372" rx="15" fill="#10070C" fill-opacity=".6" stroke="#451126"/><text x="58" y="65" fill="#C77B9B" font-family="monospace" font-size="12" letter-spacing="3">PROFILE / INTRODUCTION</text><text x="58" y="115" fill="#F8F0F3" font-family="Georgia,serif" font-size="29">A security-minded IT student</text><text x="58" y="158" fill="#D8C8CE" font-family="Arial" font-size="16">Studying Information Technology — Networking &amp; Security</text><text x="58" y="185" fill="#D8C8CE" font-family="Arial" font-size="16">at Ajman University. Focused on network defense,</text><text x="58" y="212" fill="#D8C8CE" font-family="Arial" font-size="16">penetration-testing fundamentals and malware analysis.</text><text x="58" y="265" fill="#C77B9B" font-family="monospace" font-size="11" letter-spacing="2">CURRENT DIRECTION</text><text x="58" y="294" fill="#F8F0F3" font-family="Arial" font-size="15">Build practical tools. Understand infrastructure.</text><text x="58" y="319" fill="#F8F0F3" font-family="Arial" font-size="15">Identify and reduce security risk.</text><path d="M650 52V360" stroke="#701A3D"/><text x="700" y="74" fill="#C77B9B" font-family="monospace" font-size="12" letter-spacing="2">AREAS OF INTEREST</text><rect x="700" y="105" width="156" height="30" rx="15" fill="#451126" stroke="#8B3B5D"/><text x="778" y="125" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="11">NETWORK SECURITY</text><rect x="870" y="105" width="100" height="30" rx="15" fill="#451126" stroke="#8B3B5D"/><text x="920" y="125" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="11">LINUX</text><rect x="700" y="151" width="180" height="30" rx="15" fill="#451126" stroke="#8B3B5D"/><text x="790" y="171" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="11">PENETRATION TESTING</text><rect x="920" y="151" width="156" height="30" rx="15" fill="#451126" stroke="#8B3B5D"/><text x="998" y="171" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="11">MALWARE ANALYSIS</text><rect x="700" y="197" width="164" height="30" rx="15" fill="#451126" stroke="#8B3B5D"/><text x="782" y="217" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="11">PYTHON AUTOMATION</text><rect x="908" y="197" width="164" height="30" rx="15" fill="#451126" stroke="#8B3B5D"/><text x="990" y="217" text-anchor="middle" fill="#E5B5C7" font-family="monospace" font-size="11">CLOUD FOUNDATIONS</text><rect x="700" y="265" width="420" height="70" rx="10" fill="#190B12" stroke="#451126"/><text x="724" y="292" fill="#C77B9B" font-family="monospace" font-size="10">ACADEMIC STATUS</text><text x="724" y="317" fill="#F8F0F3" font-family="Arial" font-size="14">BSc Information Technology · Class of 2027</text></svg>