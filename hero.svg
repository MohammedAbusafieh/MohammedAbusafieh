<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Mohammed Khalid Abusafieh</title><desc id="desc">A burgundy cybersecurity-themed animated profile banner.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10070C"/><stop offset=".55" stop-color="#28101C"/><stop offset="1" stop-color="#451126"/></linearGradient>
 <linearGradient id="shine"><stop stop-color="#701A3D"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D"/></linearGradient>
 <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#C77B9B" stroke-opacity=".13" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="340" rx="22" fill="url(#bg)"/><rect width="1200" height="340" rx="22" fill="url(#grid)"/>
<circle cx="1030" cy="150" r="128" fill="none" stroke="#C77B9B" stroke-opacity=".28"/><circle cx="1030" cy="150" r="92" fill="none" stroke="#E5B5C7" stroke-opacity=".22" stroke-dasharray="4 10"/>
<path d="M780 260 C860 80 940 300 1100 75" fill="none" stroke="url(#shine)" stroke-width="2" filter="url(#glow)" stroke-dasharray="9 12"><animate attributeName="stroke-dashoffset" from="0" to="-84" dur="7s" repeatCount="indefinite"/></path>
<g fill="#E5B5C7" opacity=".7"><circle cx="1030" cy="22" r="4"/><circle cx="1158" cy="150" r="4"/><circle cx="902" cy="150" r="4"/></g>
<text x="76" y="75" fill="#C77B9B" font-family="monospace" font-size="17" letter-spacing="5">NETWORKING  /  CYBERSECURITY</text>
<text x="72" y="158" fill="#F8F0F3" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700">MOHAMMED KHALID</text>
<text x="76" y="218" fill="#F8F0F3" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700">ABUSAFIEH</text>
<rect x="76" y="250" width="420" height="3" rx="2" fill="url(#shine)"/>
<text x="76" y="292" fill="#E5B5C7" font-family="monospace" font-size="18" letter-spacing="2">SECURE SYSTEMS. PRACTICAL SOLUTIONS.</text>
<text x="1018" y="158" text-anchor="middle" fill="#F8F0F3" font-family="monospace" font-size="25">[ IT / SEC ]</text>
</svg>
